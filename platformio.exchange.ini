
[RP2040_EXCHANGE]
build_flags =
  -D USE_BLOCK_DEVICE_INTERFACE
  -D EXCHANGE_FLASH_OFFSET=0x00100000
  -D EXCHANGE_FS_SIZE=0x01000000

[RP2040_EXCHANGE_16MB]
extends = RP2040_EXCHANGE, RP2040_16MB
board_build.filesystem_size = 14675968 ; 14.5MB for filesystem
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0x100000 ; 1MB for Exchange

[RP2040_EXCHANGE_4MB]
extends = RP2040_EXCHANGE, RP2040_4MB
board_build.filesystem_size = 1572864 ; 1.5MB for filesystem
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0x80000  ; 512KB for Exchange

[RP2040_EXCHANGE_2MB]
extends = RP2040_EXCHANGE, RP2040_2MB
board_build.filesystem_size = 782336 ; 764KB for filesystem
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0x40000 ; 256KB for Exchange
